name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer pin tests (Windows PowerShell, sandbox in TEMP)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\test_installer_pins.ps1
      - name: Steam-only installer test (no mode prompt, old server .env -> mode=steam with backup)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\test_installer_steam_only.ps1
      - name: Updater repo-rename fallback test (new name first, old name second)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\test_updater_rename.ps1

  release:
    needs: installer-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Check tag matches mod version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver=$(python3 -c "import json;print(json.load(open('mod/Multiplayer.json'))['version'].split('~')[0])")
          test "v$ver" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != mod version v$ver"; exit 1; }

      - name: Lua syntax + tests
        working-directory: mod
        run: |
          find . -name '*.lua' -not -path './tests/*' -print0 | xargs -0 -n1 luajit -bl > /dev/null
          luajit tests/test_three_player.lua
          luajit tests/test_steam_p2p.lua
          luajit tests/test_updater.lua
          luajit tests/test_koth.lua
          luajit tests/test_koth_client.lua
          luajit tests/test_jokers_3p.lua
          luajit tests/test_teams.lua
          luajit tests/test_multi_client.lua
          luajit tests/test_deathmatch_client.lua
          luajit tests/test_host_migration.lua
          luajit tests/test_spectator_rejoin.lua
          luajit tests/test_match_stats.lua
          luajit tests/test_host_migration_ui.lua
          luajit tests/test_patch_notes.lua
          luajit tests/test_credits.lua
          luajit tests/test_compat_guard.lua
          luajit tests/test_brand.lua
          luajit tests/test_ui_fit.lua
          luajit tests/test_steam_only.lua

      - name: Check repo name (0.6.8 rename, see docs/REPO_RENAME_NL.md)
        run: |
          want=$(python3 -c "import json;print(json.load(open('mod/brand.json'))['repo'])")
          if [ "${GITHUB_REPOSITORY}" != "$want" ]; then
            echo "::warning::running in ${GITHUB_REPOSITORY}, mod/brand.json says $want - rename the repo first (docs/REPO_RENAME_NL.md)"
          fi

      - name: Rules tests (TS reference + the in-game Lua host; the server itself is not shipped)
        working-directory: server
        run: |
          npm ci
          npm test
          npm run test:lua

      - name: Build release zips
        id: build
        run: |
          python3 tools/build_release.py --out dist-release
          # old 0.6.6/0.6.7 updaters build this exact name in their fallback path: never change it
          prefix=$(python3 -c "import json;print(json.load(open('mod/brand.json'))['asset_prefix'])")
          ls dist-release/${prefix}-v*-Installer.zip dist-release/SHA256SUMS-v*.txt dist-release/compat.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ -f "release-notes/${tag}.md" ]; then
            cp "release-notes/${tag}.md" notes.md
          else
            awk -v v="## ${tag#v}~3P" 'index($0,v)==1{f=1;next} /^## /{if(f)exit} f' mod/CHANGELOG.md > notes.md
            printf '\n**Install:** download the Installer zip, unzip it, run `Install.bat`. Already on 0.6.6+? Use the in-game "Update available" button or `Update.bat`.\n\nSupport: https://ko-fi.com/trustbendover\n' >> notes.md
          fi
          gh release create "$tag" dist-release/* --title "Balatro High Stakes ${tag#v}" --notes-file notes.md --latest

      - name: Verify the old-client update path (old repo name -> redirect -> this release)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          old=$(python3 -c "import json;print(json.load(open('mod/brand.json'))['repo_old'])")
          sleep 10
          got=$(curl -fsSL -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${old}/releases/latest" | python3 -c "import json,sys;print(json.load(sys.stdin).get('tag_name',''))" || true)
          if [ "$got" = "${GITHUB_REF_NAME}" ]; then echo "old name ${old} -> ${got}: OK"; else echo "::warning::old repo name ${old} gives '${got}', not ${GITHUB_REF_NAME} - 0.6.6/0.6.7 clients may not see this update"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: dist-release/
